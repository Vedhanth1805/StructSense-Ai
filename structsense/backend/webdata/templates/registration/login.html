<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · StructSense AI</title><style>body{margin:0;background:#080d18;color:#e5edf8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{background:#111a2b;border:1px solid #263752;border-radius:14px;padding:28px;width:min(420px,calc(100% - 30px))}label{display:block;margin:12px 0 5px;color:#91a2bb}input{width:100%;padding:10px;background:#0b1321;color:#e5edf8;border:1px solid #263752;border-radius:7px}button{margin-top:18px;padding:10px 14px;background:#123949;color:#baf4ff;border:1px solid #27768b;border-radius:7px;cursor:pointer}.err{color:#ff7777}</style></head><body><div class="card"><h1>StructSense AI</h1><p>Sign in to your structural assessment workspace.</p>{% if form.errors %}<p class="err">Username or password was not accepted.</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="id_username">Username</label>{{ form.username }}<label for="id_password">Password</label>{{ form.password }}<button type="submit">Sign in</button></form></div></body></html>
