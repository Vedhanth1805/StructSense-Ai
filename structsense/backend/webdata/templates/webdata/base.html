<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StructSense AI</title><style>
:root{color-scheme:dark;--bg:#080d18;--panel:#111a2b;--line:#263752;--text:#e5edf8;--muted:#91a2bb;--accent:#40c7df;--green:#54d18b;--amber:#f4bf55;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,sans-serif}header{border-bottom:1px solid var(--line);padding:14px max(22px,calc((100% - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:#0b1220}a{color:var(--accent)}header a{text-decoration:none}main{max-width:1180px;margin:28px auto;padding:0 20px}h1,h2,h3{line-height:1.2}h1{font-size:29px}h2{font-size:20px;margin-top:26px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.muted,small{color:var(--muted)}input,textarea,select,button{font:inherit;color:var(--text);background:#0b1321;border:1px solid var(--line);border-radius:7px;padding:9px}input[type=file]{max-width:100%}button,.button{background:#123949;border:1px solid #27768b;color:#baf4ff;cursor:pointer;text-decoration:none;display:inline-block;padding:9px 13px;border-radius:7px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}th{color:#b5c8e0}label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.notice{padding:10px 14px;border-radius:8px;background:#122333;margin:8px 0}.success{border-left:3px solid var(--green)}.error{border-left:3px solid var(--red)}.warning{border-left:3px solid var(--amber)}.status{font-weight:650}.review{min-width:1100px}.review-wrap{overflow:auto}.review input{width:105px}.review select{width:112px}.scroll{overflow:auto}canvas{width:100%;height:650px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(ellipse,#15253b,#09101c)}
</style></head><body><header><strong><a href="{% url 'dashboard' %}">🏗 StructSense AI</a></strong><nav class="row"><a href="{% url 'dashboard' %}">Projects</a><a href="/api/">API</a><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form></nav></header><main>{% if messages %}{% for message in messages %}<div class="notice {% if message.tags %}{{ message.tags }}{% endif %}">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
